services:

  postgres:
    image: postgres:17
    container_name: procurement-db
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./procurement-api

    image: procurement-api

    container_name: procurement-backend

    restart: always

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./procurement-api:/app
      - /app/node_modules

    command: sh -c "npx drizzle-kit migrate && npm run start:dev"


  frontend:
    build:
      context: ./procurement-fe

    container_name: procurement-frontend

    restart: always

    ports:
      - "3001:3000"

    depends_on:
      - backend

    volumes:
      - ./procurement-fe:/app
      - /app/node_modules


  drizzle-studio:
    image: procurement-api

    container_name: procurement-drizzle-studio

    working_dir: /app

    volumes:
      - ./procurement-api:/app
      - /app/node_modules

    ports:
      - "4984:4984"

    environment:
      DATABASE_URL: ${DATABASE_URL}

    command: npx drizzle-kit studio --host 0.0.0.0

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: