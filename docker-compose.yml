services:
  postgres:
    image: postgres:17
    container_name: procurement-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./procurement-api

    image: procurement-api
    container_name: procurement-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      FRONTEND_URL: ${FRONTEND_URL}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./procurement-api:/app
      - /app/node_modules

    command: >
      sh -c "npm install && npx drizzle-kit migrate && npm run start:dev"

    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./procurement-fe

    container_name: procurement-frontend
    restart: unless-stopped

    ports:
      - "3001:3000"

    depends_on:
      - backend

    volumes:
      - ./procurement-fe:/app
      - /app/node_modules
    command: >
      sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    stdin_open: true
    tty: true

  pgadmin:
    image: dpage/pgadmin4:9.6
    container_name: procurement-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

  rabbitmq:
    image: rabbitmq:4-management
    container_name: procurement-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: procurement
      RABBITMQ_DEFAULT_PASS: procurement_password
      RABBITMQ_DEFAULT_VHOST: procurement

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 5s
    retries: 5
volumes:
  postgres_data:
  pgadmin_data:
  rabbitmq_data:
